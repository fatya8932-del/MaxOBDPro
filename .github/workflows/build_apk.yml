name: Build MaxOBD APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean Old Icons and Build Custom OBD Logo
        run: |
          rm -f build.gradle.kts settings.gradle.kts app/build.gradle.kts
          find . -name "*.kt" -delete
          rm -rf app/src/main/res/mipmap-*
          mkdir -p app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26

          python3 -c '
          import glob
          for ext in ("**/*.gradle", "**/*.properties", "**/*.xml", "**/*.java"):
              for f in glob.glob(ext, recursive=True):
                  data = open(f, "rb").read()
                  if data.startswith(b"\xef\xbb\xbf"):
                      open(f, "wb").write(data[3:])
          '

          echo '' | base64 -d > app/src/main/res/drawable/ic_launcher_foreground.xml

          echo '' | base64 -d > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          echo '' | base64 -d > app/src/main/AndroidManifest.xml

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: MaxOBDPro-v5.2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
